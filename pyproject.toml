[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "text-to-sql-agent"
version = "0.1.0"
description = "Ask business questions in plain English and get SQL, a result table and a chart. Schema-aware, read-only, self-correcting."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Rahul Dahiya" }]
dependencies = [
  "sqlalchemy>=2.0",
  "sqlglot>=25",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pyyaml>=6",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
openai = ["openai>=1.30"]
anthropic = ["anthropic>=0.30"]
mongo = ["pymongo>=4.7"]
ui = ["streamlit>=1.50", "pandas>=2.0", "httpx>=0.27"]
all = ["psycopg[binary]>=3.1", "openai>=1.30", "anthropic>=0.30", "pymongo>=4.7", "streamlit>=1.50", "pandas>=2.0", "httpx>=0.27"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
t2sql = "t2sql.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
t2sql = ["semantic.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
